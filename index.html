<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nostalgic Nook · 1990 – early 2000s</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e6e6e6;color:#000;font:12px/1.45 Verdana,Tahoma,Geneva,sans-serif}
a{color:#000}
.top{background:#000;color:#fff;padding:8px 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.top .logo{font:bold 22px Georgia,serif;letter-spacing:.04em}
.top .sub{font-size:10px;color:#bbb;letter-spacing:.15em}
.top nav{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap}
.top nav a{color:#fff;text-decoration:none;font-size:11px}
.top nav a:hover{text-decoration:underline}
.wrap{max-width:900px;margin:14px auto;padding:0 10px;display:grid;grid-template-columns:300px 1fr;gap:14px}
.box{background:#fff;border:1px solid #000;margin-bottom:14px}
.box h2{margin:0;background:#333;color:#fff;font-size:11px;padding:4px 8px;letter-spacing:.08em;text-transform:uppercase}
.box .in{padding:10px}
.name{font:bold 18px Georgia,serif;margin:0 0 8px}
.prof{display:flex;gap:10px}
.avatar{width:110px;height:130px;flex:none;background:repeating-linear-gradient(45deg,#ddd 0 6px,#eee 6px 12px);border:1px solid #000;display:flex;align-items:center;justify-content:center;color:#777;font-size:10px;text-align:center}
.prof p{margin:0 0 4px;font-size:11px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#000;margin-right:4px;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
table.info{width:100%;border-collapse:collapse;font-size:11px}
table.info td{border:1px solid #bbb;padding:3px 6px;vertical-align:top}
table.info td:first-child{background:#eee;width:40%;font-weight:bold}
.counter{text-align:center}
.digits{display:inline-flex;gap:2px;margin-top:4px}
.digits span{background:#000;color:#fff;font:bold 15px "Courier New",monospace;padding:2px 5px}
#song{text-align:center}
#song .t{font:bold 17px Georgia,serif;margin:2px 0}
#song .a{margin:0 0 6px}
#playOLD{margin-top:6px;background:#fff;color:#000;border:1px solid #000;padding:6px 18px;font:bold 12px Verdana,sans-serif;letter-spacing:.15em;cursor:pointer}
#play:hover,#play:focus{background:#000;color:#fff}
.links{font-size:11px;margin:8px 0 0}
.links a{margin:0 6px}
.friends{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-size:10px}
.friends div div{aspect-ratio:1;background:#ddd;border:1px solid #000;margin-bottom:3px}
.cm{display:flex;gap:8px;border-top:1px solid #ccc;padding:8px 0}
.cm:first-child{border-top:0;padding-top:0}
.cm .av{width:48px;height:48px;flex:none;background:#ddd;border:1px solid #000}
.cm b{font-size:11px}.cm small{color:#666}
.cm p{margin:3px 0 0}
footer{text-align:center;font-size:10px;color:#555;padding:10px 0 20px}
@media(max-width:700px){.wrap{grid-template-columns:1fr}.top nav{margin-left:0}}
.wrap{display:block!important;max-width:640px;margin-left:auto;margin-right:auto}.row{display:flex;gap:8px;align-items:flex-start;border-top:1px solid #ccc;padding:6px 0;flex-wrap:wrap}
.row:first-child{border-top:0}
.row .dt{width:78px;flex:none;color:#555;font-size:11px}
.row .info{flex:1;min-width:0}
.row .info b{font-weight:bold}
.row .pb{flex:none;background:#fff;border:1px solid #000;font:11px Verdana,sans-serif;padding:1px 7px;cursor:pointer;color:#000;text-decoration:none}
.row .pb:hover{background:#000;color:#fff}
.row .rv{width:100%;aspect-ratio:16/9}
.row .rv iframe{width:100%;height:100%;border:1px solid #000}
.note{color:#555;margin:0}
#tog{margin-top:10px;background:#fff;border:1px solid #000;font:11px Verdana,sans-serif;padding:4px 10px;cursor:pointer}
#tog:hover{background:#000;color:#fff}
#all{margin-top:8px}


@font-face{font-family:"PM";src:url(fonts/PermanentMarker.ttf) format("truetype");font-display:swap}


.tv{width:300px;max-width:100%;margin:6px auto 0;position:relative;padding-top:34px}
.ant{position:absolute;top:0;left:50%;width:0;height:36px}
.ant i{position:absolute;bottom:0;width:2px;height:44px;background:#555;transform-origin:bottom}
.ant i:first-child{transform:rotate(-32deg)}.ant i:last-child{transform:rotate(30deg)}
.ant:after{content:"";position:absolute;bottom:-4px;left:-14px;width:28px;height:10px;background:#333;border-radius:14px 14px 0 0}
.cab{display:flex;gap:8px;background:linear-gradient(#6d6d6d,#3c3c3c);border:2px solid #111;border-radius:14px;padding:12px;box-shadow:inset 0 2px 0 #999,0 4px 0 #222}
.bez{flex:1;background:#1a1a1a;border-radius:12px;padding:8px;box-shadow:inset 0 0 0 2px #000}
.scr{position:relative;display:block;width:100%;aspect-ratio:4/3;border:0;padding:0;cursor:pointer;border-radius:18px/24px;overflow:hidden;color:#fff;
 background:#222 repeating-radial-gradient(circle at 30% 40%,#777 0 1px,#222 1px 3px);animation:snow .25s steps(3) infinite}
@keyframes snow{33%{background-position:3px 5px}66%{background-position:-4px 2px}}
.scr:before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.25) 2px 3px),radial-gradient(ellipse at 28% 18%,rgba(255,255,255,.28),transparent 45%);border-radius:inherit;box-shadow:inset 0 0 22px rgba(0,0,0,.9)}
.scr.on{animation:none;background:#000}.scr.on:before{background:radial-gradient(ellipse at 28% 18%,rgba(255,255,255,.12),transparent 40%)}
.scr iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:1}
.card{position:absolute;inset:14% 8%;z-index:1;background:rgba(0,0,0,.78);border:1px solid #fff;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:4px 6px;font-family:"Courier New",monospace}
.card[hidden]{display:none}
.card small{font-size:10px;letter-spacing:.1em;color:#bbb}
.card b{font:15px/1.1 "PM",Verdana,sans-serif}
.card span{font-size:11px}
.card em{font-style:normal;font-size:10px;letter-spacing:.12em;animation:b 1s steps(1) infinite}
.side{width:46px;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:4px}
.knob{width:30px;height:30px;border-radius:50%;background:conic-gradient(#ddd,#888,#ddd,#888,#ddd);border:2px solid #111;position:relative}
.knob:after{content:"";position:absolute;left:50%;top:2px;width:2px;height:10px;background:#111;margin-left:-1px}
.knob.sm{width:22px;height:22px}
.grill{width:34px;flex:1;min-height:30px;background:repeating-linear-gradient(#222 0 2px,transparent 2px 5px)}
#pw{width:24px;height:24px;border-radius:50%;border:2px solid #111;background:#ccc;font-size:12px;line-height:1;padding:0;cursor:pointer}
.feet{display:flex;justify-content:space-between;padding:0 30px}.feet i{width:30px;height:6px;background:#222;border-radius:0 0 4px 4px}
.deck{display:flex;justify-content:center;gap:6px;margin:10px 0 2px}
.deck button{min-width:64px;height:32px;background:linear-gradient(#fafafa,#cfcfcf);border:1px solid #000;border-bottom-width:3px;border-radius:3px;font:bold 11px Verdana,sans-serif;cursor:pointer;color:#000}
.deck button:active{border-bottom-width:1px;transform:translateY(2px)}
.deck button:disabled{opacity:.4}
@media(max-width:500px){.tv{width:260px}.side{width:38px}.knob{width:24px;height:24px}.card b{font-size:13px}}
@media(prefers-reduced-motion:reduce){.scr{animation:none}}
</style>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');
.logo.neon{font-family:'Pacifico',cursive;font-weight:400;color:#fff0fa;letter-spacing:1px;
text-shadow:0 0 3px #fff,0 0 7px #ff4fd8,0 0 14px #ff2ec4,0 0 24px #ff2ec4,0 0 40px #ff00aa;
animation:neonflick 6s infinite}
@keyframes neonflick{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.55}}
</style>
</head>
<body>
<header class="top"><span class="logo neon">Nostalgic Nook</span><span class="sub">1990 – EARLY 2000s</span>
</header>
<div class="wrap">
<main>
<div class="box" id="song"><h2>Now Playing · Song of the Day</h2><div class="in">
<div class="tv"><div class="ant"><i></i><i></i></div>
<div class="cab"><div class="bez"><button class="scr" id="scr" aria-label="Play song of the day"><span class="card" id="card"><small id="ch">CH 1 · TODAY</small><b id="st">Loading…</b><span id="sa"></span><em>▶ PRESS PLAY</em></span></button></div>
<div class="side"><span class="knob"></span><span class="knob sm"></span><span class="grill"></span>
<button id="pw" aria-label="Play or stop" style="display:flex;align-items:center;justify-content:center;padding:0"><svg viewBox="0 0 24 24" width="60%" height="60%" fill="none" stroke="#222" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 7.2a8 8 0 1 0 11.4 0"/></svg></button></div></div><div class="feet"><i></i><i></i></div></div>
<div class="deck"><button id="rw" aria-label="Previous day's song">◀ CH</button><button id="play" aria-label="Play">▶ PLAY</button><button id="ff" aria-label="Next day's song">CH ▶</button></div>
<p class="links"><a id="yt" target="_blank" rel="noopener">Listen on YouTube</a>·<a id="sp" target="_blank" rel="noopener">Spotify</a></p>
</div></div>
<div class="box" id="archive" style="display:none"><h2>Song Archive</h2><div class="in">
<div id="past"></div>
<button id="tog" aria-expanded="false">Show all songs</button>
<div id="all" hidden></div>
</div></div>
</main></div>
<script>
fetch('songs.json?v=5',{cache:'no-store'}).then(r=>r.json()).then(s=>{
const d=new Date(),doy=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(d.getFullYear(),0,0))/864e5);
let off=0,x,on=false;
function load(){x=s[((doy-1+off)%s.length+s.length)%s.length];const q=encodeURIComponent(x.title+' '+x.artist);
stopMain();st.textContent=x.title;sa.textContent=x.artist+' · '+x.year;
ch.textContent=off?'CH '+(off<0?off:'+'+off)+' · '+(off<0?(-off)+' DAY'+(off<-1?'S':'')+' AGO':off+' DAY'+(off>1?'S':'')+' AHEAD'):'CH 1 · TODAY';
yt.href='https://www.youtube.com/results?search_query='+q;sp.href='https://open.spotify.com/search/'+q;play.disabled=pw.disabled=!x.yt;}
function stopMain(){const f=scr.querySelector('iframe');if(f)f.remove();card.hidden=false;scr.classList.remove('on');on=false;play.textContent='▶ PLAY';}
function startMain(){if(!x.yt)return;stopRows();card.hidden=true;scr.classList.add('on');on=true;play.textContent='■ STOP';
 const f=document.createElement('iframe');f.src='https://www.youtube-nocookie.com/embed/'+x.yt+'?autoplay=1&rel=0&playsinline=1';f.title=x.title;f.allow='autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;scr.appendChild(f);}
scr.onclick=()=>{if(!on)startMain();};
play.onclick=pw.onclick=()=>on?stopMain():startMain();
rw.onclick=()=>{off--;load();};ff.onclick=()=>{off++;load();};
load();
const LAUNCH=new Date(2026,9,23),day=864e5;
const dayOf=t=>Math.round((new Date(t.getFullYear(),t.getMonth(),t.getDate())-new Date(t.getFullYear(),0,0))/day);
const songFor=t=>s[(dayOf(t)-1)%s.length];
const esc=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function stopRows(){document.querySelectorAll('.rv').forEach(e=>e.remove());}
function row(song,label){
  const q=encodeURIComponent(song.title+' '+song.artist),r=document.createElement('div');r.className='row';
  r.innerHTML='<span class="dt">'+esc(label)+'</span><span class="info"><b>'+esc(song.title)+'</b><br>'+esc(song.artist)+' · '+song.year+'</span>'+
    (song.yt?'<button class="pb" aria-label="Play '+esc(song.title)+'">▶</button>':'<a class="pb" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+q+'">▶</a>');
  if(song.yt)r.querySelector('button').onclick=()=>{const open=r.querySelector('.rv');stopRows();stopMain();if(open)return;
    const v=document.createElement('div');v.className='rv';v.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+song.yt+'?autoplay=1&rel=0" title="'+esc(song.title)+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';r.appendChild(v);};
  return r;}

const today=new Date(d.getFullYear(),d.getMonth(),d.getDate());
let n=0;
for(let t=new Date(today.getFullYear(),today.getMonth(),today.getDate()-1);t>=LAUNCH&&n<365;t=new Date(t.getFullYear(),t.getMonth(),t.getDate()-1),n++)
  past.appendChild(row(songFor(t),t.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})));
if(!n)past.innerHTML='<p class="note">Check back tomorrow — past songs will appear here.</p>';
tog.onclick=()=>{const show=all.hidden;all.hidden=!show;tog.textContent=show?'Hide all songs':'Show all songs';tog.setAttribute('aria-expanded',show);
  if(show&&!all.childNodes.length)s.forEach((song,i)=>all.appendChild(row(song,'#'+(i+1))));};
});
</script>
</body>
</html>

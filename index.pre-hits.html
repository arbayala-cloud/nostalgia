<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nostalgia · 1990 – early 2000s</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e6e6e6;color:#000;font:12px/1.45 Verdana,Tahoma,Geneva,sans-serif}
a{color:#000}
.top{background:#000;color:#fff;padding:8px 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.top .logo{font:bold 22px Georgia,serif;letter-spacing:.04em}
.top .sub{font-size:10px;color:#bbb;letter-spacing:.15em}
.top nav{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap}
.top nav a{color:#fff;text-decoration:none;font-size:11px}
.top nav a:hover{text-decoration:underline}
.wrap{max-width:900px;margin:14px auto;padding:0 10px;display:grid;grid-template-columns:300px 1fr;gap:14px}
.box{background:#fff;border:1px solid #000;margin-bottom:14px}
.box h2{margin:0;background:#333;color:#fff;font-size:11px;padding:4px 8px;letter-spacing:.08em;text-transform:uppercase}
.box .in{padding:10px}
.name{font:bold 18px Georgia,serif;margin:0 0 8px}
.prof{display:flex;gap:10px}
.avatar{width:110px;height:130px;flex:none;background:repeating-linear-gradient(45deg,#ddd 0 6px,#eee 6px 12px);border:1px solid #000;display:flex;align-items:center;justify-content:center;color:#777;font-size:10px;text-align:center}
.prof p{margin:0 0 4px;font-size:11px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#000;margin-right:4px;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
table.info{width:100%;border-collapse:collapse;font-size:11px}
table.info td{border:1px solid #bbb;padding:3px 6px;vertical-align:top}
table.info td:first-child{background:#eee;width:40%;font-weight:bold}
.counter{text-align:center}
.digits{display:inline-flex;gap:2px;margin-top:4px}
.digits span{background:#000;color:#fff;font:bold 15px "Courier New",monospace;padding:2px 5px}
#song{text-align:center}
#song .t{font:bold 17px Georgia,serif;margin:2px 0}
#song .a{margin:0 0 6px}
#playOLD{margin-top:6px;background:#fff;color:#000;border:1px solid #000;padding:6px 18px;font:bold 12px Verdana,sans-serif;letter-spacing:.15em;cursor:pointer}
#play:hover,#play:focus{background:#000;color:#fff}
#vid{margin-top:8px;width:100%;aspect-ratio:16/9;display:none}
#vid iframe{width:100%;height:100%;border:1px solid #000}
.links{font-size:11px;margin:8px 0 0}
.links a{margin:0 6px}
.friends{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-size:10px}
.friends div div{aspect-ratio:1;background:#ddd;border:1px solid #000;margin-bottom:3px}
.cm{display:flex;gap:8px;border-top:1px solid #ccc;padding:8px 0}
.cm:first-child{border-top:0;padding-top:0}
.cm .av{width:48px;height:48px;flex:none;background:#ddd;border:1px solid #000}
.cm b{font-size:11px}.cm small{color:#666}
.cm p{margin:3px 0 0}
footer{text-align:center;font-size:10px;color:#555;padding:10px 0 20px}
@media(max-width:700px){.wrap{grid-template-columns:1fr}.top nav{margin-left:0}}
.wrap{display:block!important;max-width:640px;margin-left:auto;margin-right:auto}.row{display:flex;gap:8px;align-items:flex-start;border-top:1px solid #ccc;padding:6px 0;flex-wrap:wrap}
.row:first-child{border-top:0}
.row .dt{width:78px;flex:none;color:#555;font-size:11px}
.row .info{flex:1;min-width:0}
.row .info b{font-weight:bold}
.row .pb{flex:none;background:#fff;border:1px solid #000;font:11px Verdana,sans-serif;padding:1px 7px;cursor:pointer;color:#000;text-decoration:none}
.row .pb:hover{background:#000;color:#fff}
.row .rv{width:100%;aspect-ratio:16/9}
.row .rv iframe{width:100%;height:100%;border:1px solid #000}
.note{color:#555;margin:0}
#tog{margin-top:10px;background:#fff;border:1px solid #000;font:11px Verdana,sans-serif;padding:4px 10px;cursor:pointer}
#tog:hover{background:#000;color:#fff}
#all{margin-top:8px}

.cas{position:relative;max-width:420px;margin:4px auto 0;aspect-ratio:1.6;background:linear-gradient(#2b2b2b,#141414);border-radius:14px;border:2px solid #000;box-shadow:0 3px 0 #999;padding:5.5% 6% 0}
.cas .scr{position:absolute;width:11px;height:11px;border-radius:50%;background:radial-gradient(#ccc,#666);box-shadow:inset 0 0 0 1px #333}
.cas .scr:after{content:"";position:absolute;left:2px;right:2px;top:5px;height:1px;background:#333;transform:rotate(35deg)}
.s1{top:6px;left:6px}.s2{top:6px;right:6px}.s3{bottom:6px;left:6px}.s4{bottom:6px;right:6px}
.lab{background:#f4f1e8;border-radius:6px;height:72%;position:relative;padding:5px 10px;border-top:9px solid #fff;background-image:repeating-linear-gradient(#f4f1e8 0 17px,#cfd6e0 17px 18px)}
.lab .side{position:absolute;left:8px;top:-9px;font:bold 9px Verdana;line-height:9px;color:#000}
.lab .hw{font:bold clamp(14px,4.4vw,19px)/1.1 "Comic Sans MS","Bradley Hand","Segoe Print",cursive;color:#1a2a6c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;text-align:left}
.lab .hw2{font:clamp(11px,3.4vw,14px)/1.3 "Comic Sans MS","Bradley Hand","Segoe Print",cursive;color:#1a2a6c;margin:2px 0 0;text-align:left}
.win{position:absolute;left:24%;right:24%;top:46%;height:23%;background:#111;border-radius:30px;border:2px solid #555;display:flex;align-items:center;justify-content:space-between;padding:0 6%}
.win .tape{position:absolute;left:30%;right:30%;top:22%;bottom:22%;background:rgba(80,60,40,.45);border-radius:3px}
.reel{position:relative;width:22%;aspect-ratio:1;border-radius:50%;background:#eee;border:3px solid #6b5640;z-index:1}
.reel:before,.reel:after{content:"";position:absolute;inset:40% -2px;background:repeating-conic-gradient(#111 0 20deg,transparent 20deg 60deg);border-radius:50%}
.reel i{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(#111 0 15deg,#eee 15deg 60deg);-webkit-mask:radial-gradient(circle,transparent 25%,#000 26% 55%,transparent 56%);mask:radial-gradient(circle,transparent 25%,#000 26% 55%,transparent 56%)}
.reel:before,.reel:after{display:none}
.spin .reel i{animation:rot 1.6s linear infinite}
@keyframes rot{to{transform:rotate(-360deg)}}
.trap{position:absolute;left:18%;right:18%;bottom:0;height:18%;background:#222;border:2px solid #000;border-bottom:0;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
.trap b{position:absolute;top:35%;width:8px;height:8px;border-radius:50%;background:#000;box-shadow:0 0 0 2px #444}
.deck{display:flex;justify-content:center;gap:6px;margin:12px 0 2px}
.deck button{min-width:52px;height:38px;background:linear-gradient(#fafafa,#cfcfcf);border:1px solid #000;border-bottom-width:4px;border-radius:3px;font:bold 13px Verdana,sans-serif;cursor:pointer;color:#000}
.deck button:active,.deck button.on{border-bottom-width:1px;transform:translateY(3px);background:#bbb}
.deck button:disabled{opacity:.4;cursor:default}
.deck small{display:block;font-size:8px;letter-spacing:.1em;font-weight:normal}
#cnt{font:11px "Courier New",monospace;color:#555;margin:2px 0 0}

@font-face{font-family:"PM";src:url(fonts/PermanentMarker.ttf) format("truetype");font-display:swap}
.cas{max-width:300px!important;border-radius:11px}
@media(max-width:500px){.cas{max-width:250px!important}.deck button{min-width:46px;height:34px}}
.lab .hw{font:16px/1.1 "PM",Verdana,sans-serif;white-space:nowrap!important;color:#111!important;letter-spacing:.02em}
.lab .hw2{font:13px/1.3 "PM",Verdana,sans-serif!important;color:#333!important}
.lab{padding:3px 9px!important}
.tick{overflow:hidden;background:#000;color:#fff;border-top:2px solid #fff;border-bottom:2px solid #fff;outline:1px solid #000;white-space:nowrap;padding:6px 0;margin-bottom:10px}
.tick div{display:inline-block;padding-left:100%;animation:tk 60s linear infinite;font:16px "PM",Verdana,sans-serif;letter-spacing:.05em}
.tick span{margin:0 14px}.tick span:after{content:"★";margin-left:28px;font-size:11px;color:#aaa}
@keyframes tk{to{transform:translateX(-100%)}}
.bands{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bd{font:15px "PM",Verdana,sans-serif;background:#fff;color:#000;border:2px solid #000;padding:5px 10px;box-shadow:3px 3px 0 #000;cursor:pointer;transition:transform .1s}
.bd:nth-child(3n){transform:rotate(-2deg)}.bd:nth-child(3n+1){transform:rotate(1.5deg)}
.bd:nth-child(4n){background:#000;color:#fff;box-shadow:3px 3px 0 #888}
.bd:hover,.bd.on{transform:rotate(0) scale(1.08);background:#000;color:#fff}
#bsongs{margin-top:12px}#bsongs h3{font:18px "PM",Verdana,sans-serif;margin:0 0 4px}
@media(prefers-reduced-motion:reduce){.tick div{animation:none;padding-left:0}}
</style>
</head>
<body>
<header class="top"><span class="logo">Nostalgia</span><span class="sub">1990 – EARLY 2000s</span>
</header>
<div class="wrap">
<main>
<div class="box" id="song"><h2>Now Playing · Song of the Day</h2><div class="in">
<div class="cas" id="cas"><span class="scr s1"></span><span class="scr s2"></span><span class="scr s3"></span><span class="scr s4"></span>
<div class="lab"><span class="side">A</span><p class="hw" id="st">Loading…</p><p class="hw2" id="sa"></p></div>
<div class="win"><span class="tape"></span><span class="reel"><i></i></span><span class="reel"><i></i></span></div>
<div class="trap"><b style="left:10%"></b><b style="right:10%"></b></div></div>
<div class="deck"><button id="rw" aria-label="Previous day's song">◀◀<small>REW</small></button><button id="play" aria-label="Play">▶<small>PLAY</small></button><button id="pz" aria-label="Pause">❚❚<small>PAUSE</small></button><button id="ff" aria-label="Next day's song">▶▶<small>FF</small></button></div>
<p id="cnt"></p><div id="vid"></div>
<p class="links"><a id="yt" target="_blank" rel="noopener">Listen on YouTube</a>·<a id="sp" target="_blank" rel="noopener">Spotify</a></p>
</div></div>
<div class="box" id="bandbox"><h2>Rad Bands · 90s &amp; 00s</h2><div class="in">
<div class="tick" aria-hidden="true"><div id="tk"></div></div>
<div class="bands" id="bands"></div><div id="bsongs"></div>
<p class="note" style="font-size:10px;margin-top:8px;text-align:center">Tap a band to see their songs on the Nostalgia list.</p>
</div></div>
<div class="box" id="archive"><h2>Song Archive</h2><div class="in">
<div id="past"></div>
<button id="tog" aria-expanded="false">Show all songs</button>
<div id="all" hidden></div>
</div></div>
</main></div>
<script>
fetch('songs.json?v=4',{cache:'no-store'}).then(r=>r.json()).then(s=>{
const d=new Date(),doy=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(d.getFullYear(),0,0))/864e5);
let off=0,x,pl=null,ytOk=false;
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
window.onYouTubeIframeAPIReady=()=>{ytOk=true};
const spin=on=>cas.classList.toggle('spin',on);
function load(){x=s[((doy-1+off)%s.length+s.length)%s.length];const q=encodeURIComponent(x.title+' '+x.artist);
st.textContent=x.title;st.style.fontSize=x.title.length>24?'12px':x.title.length>16?'14px':'';sa.textContent=x.artist+' · '+x.year;
cnt.textContent=off?(off<0?'⏪ '+(-off)+' day'+(off<-1?'s':'')+' back':'⏩ '+off+' day'+(off>1?'s':'')+' ahead'):'Today\'s tape';
yt.href='https://www.youtube.com/results?search_query='+q;sp.href='https://open.spotify.com/search/'+q;
stopMain();play.disabled=!x.yt;}
function stopMain(){if(pl&&pl.destroy)try{pl.destroy()}catch(e){}pl=null;vid.innerHTML='';vid.style.display='none';spin(false);}
play.onclick=()=>{if(!x.yt)return;stopRows();
 if(pl&&pl.playVideo){pl.playVideo();return;}
 vid.style.display='block';
 if(ytOk&&window.YT&&YT.Player){vid.innerHTML='<div id="ytp"></div>';
  pl=new YT.Player('ytp',{host:'https://www.youtube-nocookie.com',videoId:x.yt,playerVars:{autoplay:1,rel:0,playsinline:1},events:{onStateChange:e=>spin(e.data===1||e.data===3)}});}
 else{vid.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+x.yt+'?autoplay=1&rel=0&playsinline=1" title="'+x.title.replace(/"/g,'&quot;')+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';pl={};spin(true);}};
pz.onclick=()=>{if(pl&&pl.pauseVideo)pl.pauseVideo();else stopMain();spin(false);};
rw.onclick=()=>{off--;load();};ff.onclick=()=>{off++;load();};
load();
const LAUNCH=new Date(2026,9,23),day=864e5;
const dayOf=t=>Math.round((new Date(t.getFullYear(),t.getMonth(),t.getDate())-new Date(t.getFullYear(),0,0))/day);
const songFor=t=>s[(dayOf(t)-1)%s.length];
const esc=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function stopRows(){document.querySelectorAll('.rv').forEach(e=>e.remove());}
function row(song,label){
  const q=encodeURIComponent(song.title+' '+song.artist),r=document.createElement('div');r.className='row';
  r.innerHTML='<span class="dt">'+esc(label)+'</span><span class="info"><b>'+esc(song.title)+'</b><br>'+esc(song.artist)+' · '+song.year+'</span>'+
    (song.yt?'<button class="pb" aria-label="Play '+esc(song.title)+'">▶</button>':'<a class="pb" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+q+'">▶</a>');
  if(song.yt)r.querySelector('button').onclick=()=>{const open=r.querySelector('.rv');stopRows();stopMain();if(open)return;
    const v=document.createElement('div');v.className='rv';v.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+song.yt+'?autoplay=1&rel=0" title="'+esc(song.title)+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';r.appendChild(v);};
  return r;}

const BANDS=["Nirvana","Pearl Jam","Green Day","No Doubt","Backstreet Boys","NSYNC","Spice Girls","TLC","Destiny's Child","Oasis","Red Hot Chili Peppers","Foo Fighters","Blink-182","Linkin Park","Matchbox Twenty","Goo Goo Dolls","Third Eye Blind","Smash Mouth","Hootie & the Blowfish","Boyz II Men","The Cranberries","R.E.M.","Counting Crows","Ace of Base","Savage Garden","Hanson","Weezer","Sugar Ray","Creed","3 Doors Down","dc Talk","Jars of Clay","Newsboys","Coldplay","Nickelback","Maroon 5","En Vogue","All-4-One"];
tk.innerHTML=BANDS.map(b=>'<span>'+esc(b)+'</span>').join('');
BANDS.forEach(b=>{const e=document.createElement('button');e.className='bd';e.textContent=b;e.onclick=()=>{
 const was=e.classList.contains('on');document.querySelectorAll('.bd.on').forEach(z=>z.classList.remove('on'));bsongs.innerHTML='';stopRows();if(was)return;e.classList.add('on');
 const m=s.filter(z=>z.artist.toLowerCase()===b.toLowerCase());
 bsongs.innerHTML='<h3>'+esc(b)+'</h3>';
 if(m.length)m.forEach(z=>bsongs.appendChild(row(z,'#'+(s.indexOf(z)+1))));
 else{const q=encodeURIComponent(b+' greatest hits');bsongs.innerHTML+='<p class="note">Not on our song list yet — <a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+q+'">hear them on YouTube</a>.</p>';}
};bands.appendChild(e);});
const today=new Date(d.getFullYear(),d.getMonth(),d.getDate());
let n=0;
for(let t=new Date(today.getFullYear(),today.getMonth(),today.getDate()-1);t>=LAUNCH&&n<365;t=new Date(t.getFullYear(),t.getMonth(),t.getDate()-1),n++)
  past.appendChild(row(songFor(t),t.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})));
if(!n)past.innerHTML='<p class="note">Check back tomorrow — past songs will appear here.</p>';
tog.onclick=()=>{const show=all.hidden;all.hidden=!show;tog.textContent=show?'Hide all songs':'Show all songs';tog.setAttribute('aria-expanded',show);
  if(show&&!all.childNodes.length)s.forEach((song,i)=>all.appendChild(row(song,'#'+(i+1))));};
});
</script>
</body>
</html>
